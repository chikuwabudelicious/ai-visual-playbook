<!doctype html>
<html lang="ja" data-composition-variables='[
  {"id":"series","type":"string","label":"シリーズ名","default":"数字でわかる｜まちの資源回収（見本）"},
  {"id":"ep","type":"string","label":"話数","default":"#01"},
  {"id":"pre","type":"string","label":"前振り（/ で改行・2行まで）","default":"回収した古紙のうち、/もう一度紙になった割合"},
  {"id":"num","type":"string","label":"数字（{n} がカウントアップ）","default":"約{n}"},
  {"id":"cnt_from","type":"number","label":"数え始め","default":0},
  {"id":"cnt_to","type":"number","label":"数え終わり（始めと同じなら数えない）","default":80},
  {"id":"unit","type":"string","label":"単位","default":"%"},
  {"id":"b1_label","type":"string","label":"棒1の名前（空なら棒なし）","default":"回収した古紙"},
  {"id":"b1_text","type":"string","label":"棒1の値","default":"100"},
  {"id":"b1_from","type":"number","label":"棒1の始め（0〜1）","default":0},
  {"id":"b1_to","type":"number","label":"棒1の終わり（0〜1）","default":1},
  {"id":"b2_label","type":"string","label":"棒2の名前（空なら棒1だけ）","default":"もう一度紙に"},
  {"id":"b2_text","type":"string","label":"棒2の値","default":"約80"},
  {"id":"b2_from","type":"number","label":"棒2の始め","default":0},
  {"id":"b2_to","type":"number","label":"棒2の終わり","default":0.8},
  {"id":"m1","type":"string","label":"意味づけ1（/ で改行）","default":"分けて出すと、/次の紙の材料になる。"},
  {"id":"m2","type":"string","label":"意味づけ2（/ で改行）","default":"汚れた紙は、燃やすごみへ。"},
  {"id":"credit","type":"string","label":"発信者名（締めに大きく）","default":"◯◯市 資源回収センター"},
  {"id":"note","type":"string","label":"出典（1行）","default":"見本のための架空の数字です"},
  {"id":"bpm","type":"number","label":"BGM のテンポ（126〜170。倍・半分のテンポでもよい）","default":152},
  {"id":"beat_offset","type":"number","label":"最初の拍の秒","default":0}
]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Number Spotlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&display=block" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* 数字1つ（縦 1080x1920・15秒・BGMのみ）。前振り → 特大の数字がカウントアップ → 比べる棒 → 意味づけ2つ → 発信者名。
   上220px・下420px・右140px には読ませる文字を置かない（SNS の UI）。文言はすべて変数、時刻は拍 */
*{margin:0;padding:0;box-sizing:border-box;font-family:"Noto Sans JP",sans-serif;font-weight:700;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1F17;color:#F4F6F1;}
#stage{position:absolute;inset:0;background:radial-gradient(120% 70% at 30% 35%,#163C2B 0%,#0B1F17 60%);}
.ln{display:block;white-space:nowrap;line-height:1.28;}
#kicker{position:absolute;left:60px;top:250px;width:880px;font-size:28px;color:#8FB09B;white-space:nowrap;}
#k-ep{color:#F2B632;margin-left:14px;}
#pre{position:absolute;left:60px;top:330px;width:880px;color:#F4F6F1;}
#numbox{position:absolute;left:56px;top:560px;width:900px;white-space:nowrap;opacity:0;}
#num{display:inline-block;color:#F2B632;line-height:1;letter-spacing:-0.02em;}
#unit{display:inline-block;margin-left:12px;color:#F2B632;line-height:1;}
.bar{position:absolute;left:60px;width:880px;opacity:0;}
.bar .bl{font-size:34px;color:#CFE0D4;white-space:nowrap;}
.bar .bv{position:absolute;right:0;top:0;font-size:34px;color:#F4F6F1;white-space:nowrap;}
.bar .tr{position:relative;margin-top:14px;height:34px;border-radius:17px;background:#1E3A2C;overflow:hidden;}
.bar .fl{position:absolute;top:0;bottom:0;border-radius:17px;background:#F2B632;transform-origin:0 50%;}
#b1 .fl{background:#7FA58C;}
.mm{position:absolute;left:60px;width:880px;opacity:0;}
#m1{color:#F4F6F1;}
#m2{color:#F2B632;}
#end{position:absolute;left:60px;top:1110px;width:880px;padding:44px 30px 36px;border-radius:28px;background:#F4F6F1;text-align:center;opacity:0;}
#credit{display:block;color:#0B1F17;white-space:nowrap;}
#note{display:block;margin-top:16px;font-size:24px;color:#4A5A50;white-space:nowrap;}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-duration="15">
  <div id="stage" class="clip" data-start="0" data-duration="15" data-track-index="1">
    <div id="kicker"><span id="k-series"></span><span id="k-ep"></span></div>
    <div id="pre"></div>
    <div id="numbox"><span id="num"></span><span id="unit"></span></div>
    <div id="b1" class="bar"><div class="bl" id="b1l"></div><div class="bv" id="b1v"></div><div class="tr"><div class="fl" id="b1f"></div></div></div>
    <div id="b2" class="bar"><div class="bl" id="b2l"></div><div class="bv" id="b2v"></div><div class="tr"><div class="fl" id="b2f"></div></div></div>
    <div id="m1" class="mm"></div>
    <div id="m2" class="mm"></div>
    <div id="end"><span id="credit"></span><span id="note"></span></div>
  </div>
</div>
<script>
(function () {
  // 変数：宣言の既定値 ← HyperFrames の変数 ← window.__VARS（capture.py が入れる）の順に上書き
  var D = {};
  try { JSON.parse(document.documentElement.getAttribute("data-composition-variables")).forEach(function (d) { D[d.id] = d["default"]; }); } catch (e) {}
  var H = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
  var V = Object.assign(D, H, window.__VARS || {});
  function $(id) { return document.getElementById(id); }
  // 文字幅の見積もり（em）。フォント読込を待たずに大きさを決めるので、1.08 倍の余裕を見る。欧文の版は必ず静止画で確かめる
  var ASCII = [0.33,0.37,0.52,0.94,0.80,1.00,0.91,0.32,0.50,0.51,0.50,0.84,0.33,0.48,0.33,0.50,0.76,0.63,0.76,0.76,0.76,0.76,0.76,0.76,0.76,0.76,0.34,0.34,0.84,0.84,0.84,0.80,0.98,0.78,0.77,0.81,0.85,0.70,0.67,0.86,0.84,0.44,0.56,0.76,0.61,1.00,0.84,0.88,0.76,0.90,0.76,0.73,0.70,0.86,0.76,1.00,0.82,0.74,0.75,0.55,0.80,0.55,0.50,0.31,0.50,0.66,0.73,0.64,0.73,0.69,0.51,0.67,0.72,0.32,0.40,0.66,0.36,0.96,0.72,0.70,0.73,0.73,0.49,0.59,0.49,0.72,0.60,0.90,0.62,0.64,0.58,0.54,0.44,0.54,0.50];
  function est(s) {
    var w = 0;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      w += (c >= 0x20 && c < 0x7f) ? ASCII[c - 0x20] : 1.0;
    }
    return w * 1.08;
  }
  function lines(el, s, base, maxW) {
    var mx = 0; el.textContent = "";
    String(s || "").split("/").forEach(function (t) { var sp = document.createElement("span"); sp.className = "ln"; sp.textContent = t; el.appendChild(sp); mx = Math.max(mx, est(t)); });
    var f = Math.min(base, Math.floor(maxW / Math.max(mx, 0.5)));
    el.style.fontSize = f + "px";
    return f * 1.28 * String(s || "").split("/").length;
  }
  $("k-series").textContent = V.series || ""; $("k-ep").textContent = V.ep || "";
  lines($("pre"), V.pre, 62, 880);
  // 数字：最終の文字列で大きさを決める（数えている間に大きさが変わらない）
  var A = Number(V.cnt_from || 0), Z = Number(V.cnt_to || 0), tpl = String(V.num || "{n}");
  function numText(x) { return tpl.replace("{n}", String(Math.round(x))); }
  var unit = String(V.unit || ""), full = numText(Z);
  var nf = Math.min(300, Math.floor(860 / Math.max(est(full) + est(unit) * 0.42 + 0.1, 0.5)));
  $("num").style.fontSize = nf + "px"; $("unit").style.fontSize = Math.round(nf * 0.42) + "px";
  $("num").textContent = numText(A === Z ? Z : A); $("unit").textContent = unit;
  // 棒（0〜1 の範囲を塗る。原本にある比だけ）
  var nb = 0, BY = [1020, 1170];
  [1, 2].forEach(function (k) {
    var lab = V["b" + k + "_label"];
    if (!lab) { $("b" + k).style.display = "none"; return; }
    var b = $("b" + k); b.style.top = BY[nb] + "px"; nb++;
    $("b" + k + "l").textContent = lab; $("b" + k + "v").textContent = V["b" + k + "_text"] || "";
    var f0 = Math.max(0, Math.min(1, Number(V["b" + k + "_from"] || 0))), f1 = Math.max(f0, Math.min(1, Number(V["b" + k + "_to"] || 0)));
    var fl = $("b" + k + "f"); fl.style.left = (f0 * 100) + "%"; fl.style.width = Math.max((f1 - f0) * 100, 1.2) + "%";
  });
  var my = nb ? BY[nb - 1] + 150 : 1000;
  var h1 = lines($("m1"), V.m1, 58, 880); $("m1").style.top = my + "px";
  lines($("m2"), V.m2, 44, 880); $("m2").style.top = (my + h1 + 26) + "px";
  $("credit").textContent = V.credit || "";
  $("credit").style.fontSize = Math.min(54, Math.floor(820 / Math.max(est(V.credit || ""), 0.5))) + "px";
  $("note").textContent = V.note || "";
  $("note").style.fontSize = Math.min(24, Math.floor(820 / Math.max(est(V.note || ""), 0.5))) + "px";

  // ---- 時刻はすべて拍から（B(k) = 最初の拍 + k 拍）
  var SPB = 60 / Math.max(Number(V.bpm || 152), 30), OFF = Number(V.beat_offset || 0);
  function B(k) { return OFF + k * SPB; }
  var tl = gsap.timeline({ paused: true });
  tl.fromTo("#numbox", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: true }, B(2));
  if (A !== Z) {
    // カウントアップはプロキシの setter で描く（onUpdate はコマ送りで呼ばれないことがある）
    var proxy = { _v: A, get v() { return this._v; }, set v(x) { this._v = x; $("num").textContent = numText(x); } };
    tl.fromTo(proxy, { v: A }, { v: Z, duration: 2.0, ease: "power2.out", immediateRender: false }, B(2));
  }
  tl.fromTo("#numbox", { scale: 1 }, { scale: 1.05, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.out", transformOrigin: "0% 50%", immediateRender: false }, B(2) + 2.0);
  tl.fromTo(".bar", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.25, immediateRender: true }, B(8));
  tl.fromTo(".fl", { scaleX: 0 }, { scaleX: 1, duration: 0.9, stagger: 0.25, ease: "power3.out", immediateRender: true }, B(8) + 0.1);
  tl.fromTo("#m1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: true }, B(13));
  tl.fromTo("#m2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: true }, B(21));
  tl.to([".bar", "#m1", "#m2"], { opacity: 0, duration: 0.35, ease: "power1.in" }, B(30) - 0.2);
  tl.fromTo("#end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: true }, B(30) + 0.2);
  tl.set({}, {}, 15);   // 尺の終わり

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
